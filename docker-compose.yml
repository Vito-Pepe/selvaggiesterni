services:
  selvaggiesterni:
    build: .
    ports:
      # Aperta alla LAN (http://192.168.1.22:8096) e, dalla repo ingressi-https, in HTTPS nella
      # tailnet. 8080-8095 sono già usate da altre app (INFRASTRUTTURA-PI.md nella repo sillabe).
      - "8096:3000"
    volumes:
      # Copia della wiki, immagini scaricate, novità e stato degli aggiornamenti
      - dati:/data
    # Il codice non si scrive: solo il volume dei dati e /tmp
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 50
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/salute"]
      interval: 60s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  dati:
